name: Build exact Lettres 2.10 prephysical candidate
on:
  push:
    branches:
      - candidate-v2.10-final-prephysical
permissions:
  contents: write
jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[candidate-final]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate-v2.10-final-prephysical
          fetch-depth: 0
      - name: Transform exact predecessor
        run: python .candidate-build/transform_v2_10.py .
      - name: Commit exact candidate and remove temporary builder
        run: |
          rm -f .candidate-build/transform_v2_10.py .github/workflows/build_candidate_v2_10.yml
          rmdir .candidate-build 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Create exact Lettres v2.10 final prephysical candidate [candidate-final]"
          git push origin HEAD:candidate-v2.10-final-prephysical
